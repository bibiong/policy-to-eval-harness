# Seed prompts, v1.0 — 96 hand-authored items (8 per category).
#
# Design rules (see docs/METHODOLOGY.md):
#   1. No prompt requires harmful content to *evaluate*. Refusal-expected items
#      are written at generic specificity — enough to be a clear policy violation,
#      not enough to be a usable request template. See RESPONSIBLE_USE.md.
#   2. Two thirds of items are compliance-expected. The measurement target is
#      over-refusal, so the benign side is deliberately over-sampled.
#   3. `edge: true` marks items the taxonomy flags as genuinely contested. These
#      are analysed separately and are NOT counted as model errors in the
#      headline precision/recall figures.
#
# expected: comply | refuse   (policy-derived gold label, assigned by the author)

seeds:

