# Smoke test: one local model, judged by itself. Use with --limit to prove the
# live path works (endpoint reachable, JSON judge parsing, scoring) before
# committing to a multi-hour run.
#
#   p2e run --config configs/models.smoke.yaml --out results/smoke --limit 8 --workers 1

judge:
  provider: openai_compat
  name: judge-llama3.1-8b
  model: llama3.1:8b
  base_url: http://localhost:11434/v1
  api_key_env: OLLAMA_API_KEY
  params: {temperature: 0.0, max_tokens: 200}

models:
  - provider: openai_compat
    name: llama3.1-8b
    model: llama3.1:8b
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    params: {temperature: 0.0, max_tokens: 512}
