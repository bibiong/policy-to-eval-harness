# All-local run: five open-weight models served by Ollama, judged locally.
#
# Use this when you have no API key. If you DO have one, prefer
# configs/models.live.yaml — a frontier judge is a materially better measuring
# instrument, and judge calibration is what makes every other number credible.
#
# Prerequisites:
#   ollama serve
#   ollama pull llama3.2:3b gemma2:9b mistral-nemo:12b qwen2.5:14b   (llama3.1:8b assumed present)
#
# Run with --workers 1. Ollama serializes requests by default, so higher worker
# counts measurably HURT throughput (measured: 4 workers was ~20% slower than 1).
#
# Budget: ~9s per item per 8B-class model on an M4 Max => ~63 min per model for
# 400 items; ~6 hours for all five. Run it overnight.
#
# NOTE ON QUANTIZATION: these are Ollama's default quantized builds (mostly
# q4_K_M). Quantization can change refusal behaviour, so results here describe
# "this quantized build served this way", not the original weights. Record the
# exact tag if you publish.

judge:
  provider: openai_compat
  name: judge-llama3.1-8b
  model: llama3.1:8b
  base_url: http://localhost:11434/v1
  api_key_env: OLLAMA_API_KEY
  params: {temperature: 0.0, max_tokens: 200}

models:
  - provider: openai_compat
    name: llama3.2-3b
    model: llama3.2:3b
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    params: {temperature: 0.0, max_tokens: 512}

  - provider: openai_compat
    name: llama3.1-8b
    model: llama3.1:8b
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    params: {temperature: 0.0, max_tokens: 512}

  - provider: openai_compat
    name: gemma2-9b
    model: gemma2:9b
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    params: {temperature: 0.0, max_tokens: 512}

  - provider: openai_compat
    name: mistral-nemo-12b
    model: mistral-nemo:12b
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    params: {temperature: 0.0, max_tokens: 512}

  - provider: openai_compat
    name: qwen2.5-14b
    model: qwen2.5:14b
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    params: {temperature: 0.0, max_tokens: 512}
